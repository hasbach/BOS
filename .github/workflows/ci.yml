name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bos_owner
          POSTGRES_PASSWORD: ci_owner_password
          POSTGRES_DB: bos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bos_owner -d bos_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      BOS_SECRET_KEY: ci-only-secret
      BOS_COOKIE_SECURE: "false"
      BOS_TEST_DATABASE_URL: postgresql+psycopg://bos_app:ci_app_password@localhost:5432/bos_test
      BOS_TEST_MIGRATION_DATABASE_URL: postgresql+psycopg://bos_owner:ci_owner_password@localhost:5432/bos_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - name: Create application database role
        run: >-
          PGPASSWORD=ci_owner_password psql -h localhost -U bos_owner -d bos_test -v ON_ERROR_STOP=1
          -c "CREATE ROLE bos_app LOGIN PASSWORD 'ci_app_password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS"
          -c "GRANT CONNECT ON DATABASE bos_test TO bos_app"
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
